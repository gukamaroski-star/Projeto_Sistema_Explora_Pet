<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explora Pet Oficial | Redefinir Senha</title>
    <!-- Fonte Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Estilos -->
    <link rel="stylesheet" href="style.css?v=84">
</head>
<body class="login-body">
    <!-- Orbes de Brilho Decorativo Premium no Fundo -->
    <div class="bg-glow-orb-1"></div>
    <div class="bg-glow-orb-2"></div>
    <div class="login-bg-watermark"></div>

    <!-- Botão de Alternar Tema no Canto Superior Esquerdo -->
    <button class="btn btn-secondary btn-icon-only" id="theme-toggle-reset" title="Alternar Tema" type="button" style="position: absolute; top: 24px; left: 24px; z-index: 1000;">
        <i data-lucide="moon"></i>
    </button>

    <div class="login-wrapper">
        <div class="login-card" id="reset-card">
            <!-- Cabeçalho do Cartão -->
            <div class="login-header">
                <div style="height: 110px; margin-bottom: 0; display: flex; align-items: flex-end; justify-content: center;">
                    <h2 style="font-size: 1.65rem; font-weight: 800; color: var(--primary); margin: 0 0 4px 0; text-align: center; letter-spacing: -0.5px;">Bem-Vindo!</h2>
                </div>
                <p style="margin-bottom: 35px;">Insira sua nova senha abaixo para reestabelecer<br>o acesso ao sistema.</p>
            </div>

            <!-- Alerta de Erro -->
            <div class="login-error-alert" id="reset-error" style="display: none;">
                <i data-lucide="alert-triangle"></i>
                <span id="reset-error-msg">Erro ao redefinir a senha.</span>
            </div>

            <!-- Alerta de Sucesso -->
            <div class="login-error-alert" id="reset-success" style="display: none; background-color: var(--success-glow); border-color: rgba(16, 185, 129, 0.3); color: var(--success);">
                <i data-lucide="check-circle-2"></i>
                <span id="reset-success-msg">Senha redefinida com sucesso! Redirecionando...</span>
            </div>

            <!-- Formulário de Redefinição -->
            <form id="form-reset-element" onsubmit="executeResetPassword(event)">
                <div class="form-group">
                    <label for="reset-password">Nova Senha</label>
                    <div class="login-input-wrapper">
                        <i data-lucide="lock" class="input-icon"></i>
                        <input type="password" id="reset-password" required placeholder="Digite a nova senha..." autocomplete="off">
                        <button type="button" class="password-toggle-btn" id="toggle-password-1" onclick="togglePasswordVisibility('reset-password', 'toggle-password-1')" title="Visualizar senha">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label for="reset-confirm-password">Confirmar Nova Senha</label>
                    <div class="login-input-wrapper">
                        <i data-lucide="lock" class="input-icon"></i>
                        <input type="password" id="reset-confirm-password" required placeholder="Confirme a nova senha..." autocomplete="off">
                        <button type="button" class="password-toggle-btn" id="toggle-password-2" onclick="togglePasswordVisibility('reset-confirm-password', 'toggle-password-2')" title="Visualizar senha">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-login" id="btn-reset-submit">
                    <i data-lucide="shield-check"></i> Redefinir Senha
                </button>
            </form>
        </div>

        <!-- Rodapé -->
        <div class="login-footer" style="justify-content: center;">
            <p>© 2026 Explora Pet. Todos os direitos reservados.</p>
        </div>
    </div>

    <!-- Script de Lógica -->
    <script>
        // Configura ícones do Lucide
        lucide.createIcons();

        // Extrai o token dos parâmetros da URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Validação inicial do token
        const errorAlert = document.getElementById('reset-error');
        const errorMsg = document.getElementById('reset-error-msg');
        const submitBtn = document.getElementById('btn-reset-submit');
        const formElement = document.getElementById('form-reset-element');

        if (!token) {
            errorMsg.textContent = "Token de redefinição não encontrado na URL. Link inválido.";
            errorAlert.style.display = 'flex';
            submitBtn.setAttribute('disabled', 'true');
        }

        // Alternar visualização da senha
        function togglePasswordVisibility(inputId, btnId) {
            const passwordInput = document.getElementById(inputId);
            const toggleBtn = document.getElementById(btnId);
            const isPrivate = passwordInput.getAttribute('type') === 'password';
            
            passwordInput.setAttribute('type', isPrivate ? 'text' : 'password');
            toggleBtn.innerHTML = isPrivate ? '<i data-lucide="eye-off"></i>' : '<i data-lucide="eye"></i>';
            
            lucide.createIcons();
        }

        // Alternador de Temas
        const themeToggle = document.getElementById('theme-toggle-reset');
        const savedTheme = localStorage.getItem('theme') || 'dark';

        if (savedTheme === 'light') {
            document.documentElement.classList.add('light-theme');
            themeToggle.innerHTML = '<i data-lucide="sun"></i>';
        } else {
            document.documentElement.classList.remove('light-theme');
            themeToggle.innerHTML = '<i data-lucide="moon"></i>';
        }
        lucide.createIcons();

        themeToggle.addEventListener('click', () => {
            const isLight = document.documentElement.classList.toggle('light-theme');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            themeToggle.innerHTML = isLight ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
            lucide.createIcons();
        });

        // Remove destaque de erro ao digitar novamente nos campos
        document.getElementById('reset-password').addEventListener('input', function() {
            this.classList.remove('is-invalid');
        });
        document.getElementById('reset-confirm-password').addEventListener('input', function() {
            this.classList.remove('is-invalid');
        });

        // Executar Redefinição via AJAX
        async function executeResetPassword(e) {
            e.preventDefault();
            
            const passwordInput = document.getElementById('reset-password');
            const confirmInput = document.getElementById('reset-confirm-password');
            const successAlert = document.getElementById('reset-success');
            const successMsg = document.getElementById('reset-success-msg');

            // Limpa estados de erro anteriores
            passwordInput.classList.remove('is-invalid');
            confirmInput.classList.remove('is-invalid');
            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';

            const password = passwordInput.value;
            const confirmPassword = confirmInput.value;

            if (password !== confirmPassword) {
                errorMsg.textContent = "As senhas digitadas não coincidem.";
                errorAlert.style.display = 'flex';
                passwordInput.classList.add('is-invalid');
                confirmInput.classList.add('is-invalid');
                return;
            }

            if (password.length < 4) {
                errorMsg.textContent = "A senha deve conter no mínimo 4 caracteres.";
                errorAlert.style.display = 'flex';
                passwordInput.classList.add('is-invalid');
                return;
            }

            // Feedback visual
            submitBtn.setAttribute('disabled', 'true');
            submitBtn.innerHTML = '<div class="spinner" style="width: 16px; height: 16px; border-width: 2px; margin: 0 auto;"></div>';

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                if (response.ok) {
                    successAlert.style.display = 'flex';
                    submitBtn.innerHTML = 'Senha Alterada!';
                    
                    // Oculta o formulário para focar no sucesso
                    formElement.style.display = 'none';

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2500);
                } else {
                    const err = await response.json();
                    errorMsg.textContent = err.detail || "Erro ao tentar redefinir senha.";
                    errorAlert.style.display = 'flex';
                    
                    passwordInput.classList.add('is-invalid');
                    confirmInput.classList.add('is-invalid');
                    
                    submitBtn.removeAttribute('disabled');
                    submitBtn.innerHTML = '<i data-lucide="shield-check"></i> Redefinir Senha';
                    lucide.createIcons();
                }
            } catch (err) {
                errorMsg.textContent = "Erro de conexão ao servidor.";
                errorAlert.style.display = 'flex';
                
                passwordInput.classList.add('is-invalid');
                confirmInput.classList.add('is-invalid');
                
                submitBtn.removeAttribute('disabled');
                submitBtn.innerHTML = '<i data-lucide="shield-check"></i> Redefinir Senha';
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
